name: iOS Build & TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'ui/**'
      - 'internal/**'
      - 'cmd/**'
      - 'go.mod'
      - 'go.sum'
      - 'third_party/**'
      - '.github/workflows/ios.yml'

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID || 'JULAN5X9MC' }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID || '1060483a-13e2-4249-b9cd-bae5e2bc2da6' }}
      TEAM_ID: 9WR9JH4M83
      BUNDLE_ID: com.cui.cagemobile
      PROFILE_NAME: CageMobile AppStore

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Show toolchain
        run: |
          xcodebuild -version
          go version
          node --version
          npm --version

      - name: Import Apple Distribution certificate
        run: |
          CERT_PATH="$RUNNER_TEMP/CageMobile.p12"
          KEYCHAIN="cagemobile-build.keychain"
          KEYCHAIN_PASSWORD="cagemobile-keychain-pwd"
          printf '%s' "$P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_P12_PASSWORD }}

      - name: Install provisioning profile
        run: |
          set -euo pipefail
          PROFILE="$RUNNER_TEMP/CageMobile.mobileprovision"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$PROFILE"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/CageMobile-profile.plist"

          python3 - <<'PY'
          import datetime
          import hashlib
          import os
          import plistlib
          import subprocess
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          with (temp / "CageMobile-profile.plist").open("rb") as stream:
              profile = plistlib.load(stream)
          if profile["Name"] != os.environ["PROFILE_NAME"]:
              raise SystemExit("Unexpected provisioning profile name")
          app_id = f'{os.environ["TEAM_ID"]}.{os.environ["BUNDLE_ID"]}'
          if profile["Entitlements"]["application-identifier"] != app_id:
              raise SystemExit("Provisioning profile belongs to a different app")
          if profile["ExpirationDate"] <= datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None):
              raise SystemExit("Provisioning profile has expired")

          identities = subprocess.check_output(
              ["security", "find-identity", "-v", "-p", "codesigning"], text=True
          )
          if not any(hashlib.sha1(certificate).hexdigest().upper() in identities
                     for certificate in profile["DeveloperCertificates"]):
              raise SystemExit("The imported signing certificate does not match the provisioning profile")

          profile_dir = Path.home() / "Library/Developer/Xcode/UserData/Provisioning Profiles"
          profile_dir.mkdir(parents=True, exist_ok=True)
          (profile_dir / f'{profile["UUID"]}.mobileprovision').write_bytes(
              (temp / "CageMobile.mobileprovision").read_bytes()
          )
          print("App Store provisioning profile and signing identity verified")
          PY
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}

      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Build iOS artifacts
        run: bash mobile/build.sh ios

      - name: Archive with manual signing
        timeout-minutes: 12
        run: |
          set -euo pipefail
          BUILD_NUM="$((1000 + GITHUB_RUN_NUMBER)).${GITHUB_RUN_ATTEMPT}"
          xcodebuild archive \
            -project mobile/ios/CageMobile.xcodeproj \
            -scheme CageMobile \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$GITHUB_WORKSPACE/build/CageMobile.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUM" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"
          ARCHIVE_INFO="$GITHUB_WORKSPACE/build/CageMobile.xcarchive/Products/Applications/CageMobile.app/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$ARCHIVE_INFO")" = "$BUILD_NUM"

      - name: Export signed IPA
        timeout-minutes: 8
        run: |
          set -euo pipefail
          OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$OPTIONS" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>$BUNDLE_ID</key>
                  <string>$PROFILE_NAME</string>
              </dict>
              <key>destination</key>
              <string>export</string>
              <key>manageAppVersionAndBuildNumber</key>
              <false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$GITHUB_WORKSPACE/build/CageMobile.xcarchive" \
            -exportOptionsPlist "$OPTIONS" \
            -exportPath "$GITHUB_WORKSPACE/build/export"

      - name: Upload to App Store Connect
        timeout-minutes: 10
        run: |
          set -euo pipefail
          umask 077
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          printf '%s' "$API_KEY" > "$KEY_DIR/AuthKey_${APPSTORE_KEY_ID}.p8"
          xcrun altool --upload-app --type ios \
            --file "$GITHUB_WORKSPACE/build/export/CageMobile.ipa" \
            --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID"
        env:
          API_KEY: ${{ secrets.APPSTORE_API_KEY }}
