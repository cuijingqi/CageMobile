name: iOS Build & TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'ui/**'
      - 'internal/**'
      - 'cmd/**'
      - 'go.mod'
      - 'go.sum'
      - 'third_party/**'
      - '.github/workflows/ios.yml'

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID || 'JULAN5X9MC' }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID || '1060483a-13e2-4249-b9cd-bae5e2bc2da6' }}
      TEAM_ID: 9WR9JH4M83

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Show toolchain
        run: |
          xcodebuild -version
          go version
          node --version
          npm --version

      - name: Write App Store Connect API key
        run: |
          KEY_ID="$APPSTORE_KEY_ID"
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$API_KEY" > "$RUNNER_TEMP/private_keys/AuthKey_${KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey_${KEY_ID}.p8"
        env:
          API_KEY: ${{ secrets.APPSTORE_API_KEY }}

      - name: Import Apple Distribution certificate
        run: |
          CERT_PATH="$RUNNER_TEMP/CageMobile.p12"
          KEYCHAIN="cagemobile-build.keychain"
          KEYCHAIN_PASSWORD="cagemobile-keychain-pwd"
          printf '%s' "$P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_P12_PASSWORD }}

      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Build iOS artifacts
        run: bash mobile/build.sh ios

      - name: Write export options
        run: |
          cat > "$GITHUB_WORKSPACE/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>9WR9JH4M83</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>destination</key>
              <string>upload</string>
              <key>uploadSymbols</key>
              <true/>
              <key>manageAppVersionAndBuildNumber</key>
              <true/>
          </dict>
          </plist>
          PLIST

      - name: Archive and upload
        run: |
          set -euo pipefail
          KEY_ID="$APPSTORE_KEY_ID"
          ISSUER="$APPSTORE_ISSUER_ID"
          AUTH_KEY="$RUNNER_TEMP/private_keys/AuthKey_${KEY_ID}.p8"
          BUILD_NUM="$(( 1000 + ${{ github.run_number }} ))"

          xcodebuild archive \
            -project mobile/ios/CageMobile.xcodeproj \
            -scheme CageMobile \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$GITHUB_WORKSPACE/build/CageMobile.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUM" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER"

          xcodebuild -exportArchive \
            -archivePath "$GITHUB_WORKSPACE/build/CageMobile.xcarchive" \
            -exportOptionsPlist "$GITHUB_WORKSPACE/ExportOptions.plist" \
            -exportPath "$GITHUB_WORKSPACE/build/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER"

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CageMobile-iOS
          path: build/export/*.ipa
          if-no-files-found: ignore
          retention-days: 7

